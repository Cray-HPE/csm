#
# List of charts that can successfully be deployed on K8s 1.24.
# This file is based on the core-services.yaml from CSM 1.7.0-alpha.16.
#
# Most of these charts can also be deployed on K8s 1.32.
# The charts that can only be deployed on K8s 1.24 are noted.
# Charts that can only be deployed on K8s 1.32 are contained in
# the post-upgrade-deploy-v1.32.yaml manifest and will be deployed
# after upgrade to K8s 1.32.
#
apiVersion: manifests/v1beta1
metadata:
  name: core-services
spec:
  sources:
    charts:
    - name: csm-algol60
      type: repo
      location: https://artifactory.algol60.net/artifactory/csm-helm-charts/
  charts:

  # HMS
  - name: cray-hms-sls
    source: csm-algol60
    version: 6.1.3
    namespace: services
    swagger:
    - name: sls
      version: v2
      url: https://raw.githubusercontent.com/Cray-HPE/hms-sls/v2.10.0/api/openapi.yaml
  - name: cray-hms-smd
    source: csm-algol60
    version: 7.2.7
    namespace: services
    values:
      cray-service:
        sqlCluster:
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
    swagger:
    - name: smd
      version: v2
      url: https://raw.githubusercontent.com/Cray-HPE/hms-smd/v2.38.0/api/swagger_v2.yaml
  - name: cray-hms-meds
    source: csm-algol60
    version: 3.1.3
    namespace: services
  - name: cray-hms-discovery
    source: csm-algol60
    version: 3.1.1
    namespace: services

  # Cray DHCP Kea
  # DO NOT INSTALL cray-dhcp-kea chart, we want to keep running the CSM 1.6 version

  # Cray DNS unbound (resolver)
  # DO NOT INSTALL cray-dns-unbound chart, we want to keep running the CSM 1.6 version

  # Cray DNS powerdns
  - name: cray-dns-powerdns
    source: csm-algol60
    version: 0.5.0 # update platform.yaml cray-precache-images with this
    namespace: services

  - name: cray-powerdns-manager
    source: csm-algol60
    version: 0.8.4 # update platform.yaml cray-precache-images with this
    namespace: services
