# The list of charts and versions in platform-v1.24.yaml should match that
# of platform.yaml minus the following charts:
#     kyverno-policy
#     cray-kyverno-policies-upstream
#     cray-sysmgmt-health
#     cray-postgres-operator
#     cray-hubble
#     rack-resiliency
