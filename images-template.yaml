images:
- name: "master-__CSM_REL_NAME__"
  base:
    product:
      name: csm
      version: "__CSM_RELEASE__"
      type: image
      filter:
        prefix: secure-kubernetes
  configuration: "__MASTER_CONFIG__"
  configuration_group_names:
  - Management_Master

- name: "worker-__CSM_REL_NAME__"
  base:
    product:
      name: csm
      version: "__CSM_RELEASE__"
      type: image
      filter:
        prefix: secure-kubernetes
  configuration: "__WORKER_CONFIG__"
  configuration_group_names:
  - Management_Worker

- name: "storage-__CSM_REL_NAME__"
  base:
    product:
      name: csm
      version: "__CSM_RELEASE__"
      type: image
      filter:
        prefix: secure-storage-ceph
  configuration: "__STORAGE_CONFIG__"
  configuration_group_names:
  - Management_Storage
