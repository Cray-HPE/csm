---
iuf_version: ^0.5.0
name: csm
description: >
  The Cray System Management (CSM).
version: 1.7.1-patch.1

# implementing hooks for patch install through IUF
hooks:
  deliver_product:
    pre:
      script_path: hooks/deliver-product-prehook.sh
    post:
      script_path: hooks/deliver-product-posthook.sh

# an empty folder has been added for docker content just to validate the manifest file against the schema
content:
  docker:
    - path: dummy

  rpms:
    - path: rpm/cray/csm/noos
      repository_name: csm-1.7.1-noos
      repository_type: raw
